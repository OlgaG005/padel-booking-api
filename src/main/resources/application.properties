spring.application.name=padelbooking

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:padelbookingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:padelBookingSecretKeyForJwtAuthenticationThatIsLongEnough123456}
jwt.expiration=${JWT_EXPIRATION:86400000}